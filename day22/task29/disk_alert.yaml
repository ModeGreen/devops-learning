# Пороги по умолчанию — для всех дисков
default:
  warning: 75
  critical: 90

# Свои пороги для отдельных дисков
disks:
  /var:            # здесь растут логи — тревога раньше
    warning: 70
    critical: 85
  /boot:           # маленький раздел, обычно почти полный — задан только critical
    critical: 95

# Эти диски не проверяем
ignore:
  - /mnt/backup    # диск для бэкапов, заполнен специально
